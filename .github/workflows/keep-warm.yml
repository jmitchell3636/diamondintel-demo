name: Keep Streamlit app warm

on:
  schedule:
    # Every 10 minutes. Streamlit Community Cloud puts idle apps to sleep;
    # a periodic visit keeps this one awake so coaches never hit a cold start.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            --max-time 60 --retry 2 --retry-delay 5 \
            "https://diamondintel-demo-pau4khljnwlvnj4qhd2wjs.streamlit.app/"
